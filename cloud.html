<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Gaming: Plutonium Network</title>
  <link rel="icon" type="image/png" href="img/brand/icon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/cloud.css" />
  <script src="js/settings-apply.js"></script>
</head>
<body>

  <div id="particles-js"></div>
  <div id="vanta-bg"></div>

  <div class="cg-page">
    <div class="cg-heading-row">
      <h1 class="cg-heading">Cloud Gaming</h1>
      <div class="cg-search" id="cg-search">
        <button class="cg-search__btn" id="cg-search-btn" aria-label="Search games">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <input class="cg-search__input" id="cg-search-input" type="text" placeholder="Search games…" autocomplete="off" />
        <span class="cg-search__sizer" id="cg-search-sizer" aria-hidden="true"></span>
      </div>
    </div>
    <div class="cg-grid" id="cg-grid"></div>
    <p class="cg-no-results" id="cg-no-results" style="display:none">No games found.</p>
  </div>

  <script src="bg/js/particles.min.js"></script>
  <script src="bg/js/three.min.js"></script>
  <script src="bg/js/p5.min.js"></script>
  <script src="bg/js/vanta.birds.min.js"></script>
  <script src="bg/js/vanta.fog.min.js"></script>
  <script src="bg/js/vanta.waves.min.js"></script>
  <script src="bg/js/vanta.clouds.min.js"></script>
  <script src="bg/js/vanta.globe.min.js"></script>
  <script src="bg/js/vanta.net.min.js"></script>
  <script src="bg/js/vanta.trunk.min.js"></script>
  <script src="bg/js/vanta.topology.min.js"></script>
  <script src="bg/js/vanta.dots.min.js"></script>
  <script src="bg/js/vanta.rings.min.js"></script>
  <script src="bg/js/vanta.halo.min.js"></script>
  <script src="js/home-dock.js"></script>
  <script src="js/nav.js"></script>
  <script src="bg/js/bg-init.js"></script>
  <script src="js/cloud.js"></script>
</body>
</html>
